name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          # По тегу v* — обычный релиз; при ручном запуске — rolling-релиз pre-release
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'pre-release' }}
          releaseName: ${{ github.ref_type == 'tag' && format('MEYAFORGE {0}', github.ref_name) || 'MEYAFORGE pre-release' }}
          # Draft, т.к. в репозитории включены immutable releases:
          # ассеты можно загружать только в черновик, публикация — вручную на GitHub
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' }}
